<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小原 AI 助手</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #176b5b;
      --accent-strong: #0e5448;
      --accent-soft: #e8f4f0;
      --ink: #202723;
      --muted: #6c7770;
      --line: #dfe6e1;
      --panel: rgba(253, 254, 252, .94);
      --sidebar: #f3f6f3;
      --canvas: #f8faf7;
      --danger: #c93649;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      overflow: hidden;
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 0%, rgba(23, 107, 91, .09), transparent 30rem),
        linear-gradient(145deg, #f6f8f5, #e9efeb);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app {
      width: min(1280px, 100%);
      height: 100dvh;
      margin: auto;
      display: grid;
      grid-template-columns: 264px minmax(0, 1fr);
      overflow: hidden;
      background: var(--panel);
      border-inline: 1px solid var(--line);
      box-shadow: 0 0 60px rgba(32, 55, 45, .08);
    }
    .sidebar {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }
    .sidebar-header {
      min-height: 74px;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid var(--line);
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      box-shadow: 0 7px 18px rgba(23, 107, 91, .18);
      font-size: 15px;
      font-weight: 750;
    }
    .sidebar-header h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
    .sidebar-header p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
    }
    .sandbox-nav {
      min-height: 40px;
      margin: 10px 10px 0;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #afd1c8;
      border-radius: 10px;
      color: var(--accent);
      background: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: 650;
    }
    .sandbox-nav[hidden] { display: none; }
    .sandbox-nav + .sandbox-nav { margin-top: 6px; }
    .sandbox-nav:hover { background: var(--accent-soft); }
    .sandbox-nav:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .sandbox-nav svg { width: 16px; height: 16px; }
    .session-list {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 12px 9px;
      scrollbar-gutter: stable;
    }
    .session-item {
      margin-bottom: 4px;
      padding: 4px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      border-radius: 11px;
      color: var(--ink);
    }
    .session-item:hover { background: rgba(255, 255, 255, .72); }
    .session-item.active {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .session-item.new-session {
      margin-bottom: 10px;
      border: 1px solid var(--line);
      background: white;
    }
    .session-item.new-session.active {
      border-color: #afd1c8;
      background: var(--accent-soft);
    }
    .session-main {
      min-width: 0;
      padding: 8px;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .session-title {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-title-input {
      display: block;
      width: 100%;
      height: 24px;
      padding: 2px 5px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      outline: none;
      color: var(--ink);
      background: white;
      font-size: 13px;
      font-weight: 600;
    }
    .session-title-input.error { border-color: var(--danger); }
    .session-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }
    .session-actions {
      display: flex;
      opacity: 0;
      transition: opacity .16s ease;
    }
    .session-item:hover .session-actions,
    .session-item.active .session-actions { opacity: 1; }
    .icon-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
    }
    .icon-button svg { width: 15px; height: 15px; }
    .icon-button:hover { color: var(--accent); background: white; }
    .icon-button.delete:hover { color: var(--danger); }
    .icon-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .chat {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      background: var(--canvas);
    }
    .chat-header {
      min-height: 74px;
      padding: 14px 26px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: rgba(253, 254, 252, .88);
      backdrop-filter: blur(18px);
    }
    .chat-header h1 {
      margin: 0;
      overflow: hidden;
      font-size: 17px;
      letter-spacing: -.015em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-header p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .model-picker {
      position: relative;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .model-trigger {
      min-width: 210px;
      max-width: 280px;
      height: 40px;
      padding: 0 11px 0 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: white;
      font: inherit;
      cursor: pointer;
      display: grid;
      grid-template-columns: minmax(0, auto) auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      text-align: left;
      transition:
        border-color .18s ease,
        background-color .18s ease,
        transform .18s cubic-bezier(.16, 1, .3, 1);
    }
    .model-trigger:hover {
      border-color: #c6d3e8;
      background: #fbfcff;
    }
    .model-trigger:active { transform: scale(.98); }
    .model-trigger:focus-visible,
    .provider-button:focus-visible,
    .model-option:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .current-provider {
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
    }
    .model-separator { color: #b8c0cf; }
    .current-model {
      overflow: hidden;
      font-weight: 650;
      text-overflow: ellipsis;
    }
    .model-trigger-chevron {
      width: 15px;
      height: 15px;
      transition: transform .18s cubic-bezier(.16, 1, .3, 1);
    }
    .model-trigger[aria-expanded="true"] .model-trigger-chevron {
      transform: rotate(180deg);
    }
    .model-menu,
    .model-submenu {
      padding: 6px;
      border: 1px solid rgba(216, 224, 237, .96);
      border-radius: 14px;
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 18px 50px rgba(29, 42, 70, .16);
      backdrop-filter: blur(16px);
    }
    .model-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 248px;
      width: 190px;
    }
    .provider-item {
      position: relative;
    }
    .provider-item::after {
      position: absolute;
      top: 0;
      right: -10px;
      width: 10px;
      height: 100%;
      content: "";
    }
    .provider-button,
    .model-option {
      width: 100%;
      border: 0;
      border-radius: 9px;
      color: var(--ink);
      background: transparent;
      font: inherit;
      text-align: left;
    }
    .provider-button {
      min-height: 44px;
      padding: 8px 9px;
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
    }
    .provider-item.active > .provider-button,
    .provider-item:hover > .provider-button,
    .provider-item:focus-within > .provider-button {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .provider-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #63a36f;
      box-shadow: 0 0 0 3px rgba(99, 163, 111, .12);
    }
    .provider-copy {
      min-width: 0;
      display: grid;
      gap: 2px;
    }
    .provider-name {
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      text-overflow: ellipsis;
    }
    .provider-count {
      color: var(--muted);
      font-size: 10px;
    }
    .provider-chevron {
      width: 14px;
      height: 14px;
      transition: transform .18s cubic-bezier(.16, 1, .3, 1);
    }
    .model-submenu {
      position: absolute;
      top: -6px;
      left: calc(100% + 8px);
      width: 240px;
      max-height: min(420px, calc(100dvh - 120px));
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-6px);
      transition:
        opacity .14s ease,
        transform .18s cubic-bezier(.16, 1, .3, 1);
    }
    .provider-item.active > .model-submenu,
    .provider-item:hover > .model-submenu,
    .provider-item:focus-within > .model-submenu {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }
    .model-option {
      min-height: 44px;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
    }
    .model-option:hover,
    .model-option.selected {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .model-option-name {
      overflow: hidden;
      font-size: 12px;
      font-weight: 620;
      text-overflow: ellipsis;
    }
    .model-option-status {
      color: var(--muted);
      font-size: 9px;
    }
    .model-option.selected .model-option-status {
      color: var(--accent);
    }
    @media (prefers-reduced-motion: reduce) {
      .model-trigger,
      .model-trigger-chevron,
      .provider-chevron,
      .model-submenu {
        transition: none;
      }
    }
    .messages {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      padding: 30px clamp(20px, 4vw, 52px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      background:
        radial-gradient(circle at 84% 10%, rgba(23, 107, 91, .045), transparent 24rem),
        var(--canvas);
      scroll-behavior: smooth;
    }
    .welcome {
      max-width: 420px;
      margin: auto;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .bubble {
      max-width: min(82%, 760px);
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 7px 18px 18px 18px;
      line-height: 1.72;
      background: white;
      box-shadow: 0 5px 20px rgba(34, 55, 45, .045);
      overflow-wrap: anywhere;
    }
    .user .bubble {
      color: white;
      white-space: pre-wrap;
      border-color: var(--accent);
      border-radius: 18px 7px 18px 18px;
      background: var(--accent);
      box-shadow: 0 8px 22px rgba(23, 107, 91, .15);
    }
    .assistant .bubble > :first-child { margin-top: 0; }
    .assistant .bubble > :last-child { margin-bottom: 0; }
    .assistant .bubble p { margin: .72em 0; }
    .assistant .bubble h1,
    .assistant .bubble h2,
    .assistant .bubble h3,
    .assistant .bubble h4,
    .assistant .bubble h5,
    .assistant .bubble h6 {
      margin: 1.2em 0 .55em;
      line-height: 1.35;
      letter-spacing: -.012em;
    }
    .assistant .bubble h1 { font-size: 1.35em; }
    .assistant .bubble h2 { font-size: 1.22em; }
    .assistant .bubble h3 { font-size: 1.1em; }
    .assistant .bubble h4,
    .assistant .bubble h5,
    .assistant .bubble h6 { font-size: 1em; }
    .assistant .bubble ul,
    .assistant .bubble ol {
      margin: .7em 0;
      padding-left: 1.5em;
    }
    .assistant .bubble li { margin: .28em 0; padding-left: .18em; }
    .assistant .bubble li::marker { color: var(--accent); }
    .assistant .bubble strong { font-weight: 720; }
    .assistant .bubble a {
      color: var(--accent);
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }
    .assistant .bubble code {
      padding: .12em .38em;
      border: 1px solid #dce5df;
      border-radius: 6px;
      color: #154e43;
      background: #f1f6f3;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: .9em;
    }
    .assistant .bubble pre {
      margin: .9em 0;
      padding: 14px 16px;
      overflow-x: auto;
      border: 1px solid #2c3c35;
      border-radius: 12px;
      color: #e9f0ec;
      background: #1d2924;
      line-height: 1.6;
    }
    .assistant .bubble pre code {
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font-size: .88em;
    }
    .assistant .bubble blockquote {
      margin: .9em 0;
      padding: .15em 0 .15em 1em;
      border-left: 3px solid #8bb7ac;
      color: var(--muted);
    }
    .assistant .bubble hr {
      margin: 1.1em 0;
      border: 0;
      border-top: 1px solid var(--line);
    }
    .table-wrap {
      max-width: 100%;
      margin: .9em 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .assistant table {
      width: 100%;
      min-width: 420px;
      border-collapse: collapse;
      font-size: .94em;
    }
    .assistant th,
    .assistant td {
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .assistant th { background: #f1f5f2; font-weight: 700; }
    .assistant tr:last-child td { border-bottom: 0; }
    .assistant del { color: var(--muted); }
    .row.message-error .bubble {
      border-color: #efc7cd;
      color: #9e2e3e;
      background: #fff7f8;
    }
    .booking-card {
      width: min(100%, 620px);
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid #b9d6ce;
      border-radius: 18px;
      background: linear-gradient(145deg, #fbfffd, #f2f8f5);
      box-shadow: 0 14px 35px rgba(23, 107, 91, .1);
    }
    .booking-card-head {
      padding: 17px 19px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid #d9e8e2;
      background: rgba(255, 255, 255, .7);
    }
    .booking-card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #124f43;
      font-weight: 760;
    }
    .booking-card-title svg { width: 21px; height: 21px; flex: 0 0 auto; }
    .booking-status {
      padding: 4px 9px;
      border-radius: 999px;
      color: #756127;
      background: #fff3c4;
      font-size: 12px;
      font-weight: 680;
      white-space: nowrap;
    }
    .booking-status.confirmed { color: #0d6b4f; background: #dff5eb; }
    .booking-status.expired,
    .booking-status.cancelled { color: #8b3f49; background: #fbe6e9; }
    .booking-card-body {
      padding: 17px 19px 19px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }
    .booking-field { min-width: 0; display: grid; gap: 6px; }
    .booking-field.wide { grid-column: 1 / -1; }
    .booking-field label {
      color: #63746d;
      font-size: 12px;
      font-weight: 650;
    }
    .booking-field input,
    .booking-field select {
      width: 100%;
      height: 41px;
      padding: 0 11px;
      border: 1px solid #cfddd7;
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: white;
      font: inherit;
      font-size: 14px;
    }
    .booking-field input:focus,
    .booking-field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 91, .09);
    }
    .booking-room-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .booking-refresh {
      min-width: 84px;
      border: 1px solid #c7d9d2;
      border-radius: 10px;
      color: #155e51;
      background: #eff8f4;
      font-weight: 650;
    }
    .booking-actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      padding-top: 4px;
    }
    .booking-action {
      min-height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 11px;
      font-weight: 700;
    }
    .booking-action.save { color: #155e51; background: #deeee8; }
    .booking-action.confirm {
      color: white;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(23, 107, 91, .18);
    }
    .booking-action:focus-visible,
    .booking-refresh:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .booking-feedback {
      grid-column: 1 / -1;
      min-height: 18px;
      color: #6a766f;
      font-size: 12px;
    }
    .booking-feedback.error { color: #a52f40; }
    .booking-proof {
      grid-column: 1 / -1;
      padding: 12px 13px;
      border: 1px solid #c8e6da;
      border-radius: 11px;
      color: #155e51;
      background: #eaf8f2;
      font-size: 13px;
      line-height: 1.6;
    }
    .booking-card.is-locked input,
    .booking-card.is-locked select,
    .booking-card.is-locked button { opacity: .7; }
    .composer {
      padding: 15px 26px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
      background: rgba(253, 254, 252, .94);
      backdrop-filter: blur(18px);
    }
    .composer input {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      font-size: 15px;
      color: var(--ink);
      background: white;
      transition:
        border-color .16s ease,
        box-shadow .16s ease;
    }
    .composer input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 91, .1);
    }
    .send-button {
      min-width: 72px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      font-weight: 600;
      transition:
        background-color .16s ease,
        transform .16s cubic-bezier(.16, 1, .3, 1);
    }
    .send-button:hover { background: var(--accent-strong); }
    .send-button:active { transform: scale(.98); }
    .send-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button:disabled { opacity: .5; cursor: wait; }
    [hidden] { display: none !important; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      opacity: 0;
      background: rgba(18, 27, 45, .38);
      backdrop-filter: blur(8px);
      transition: opacity .18s ease;
    }
    .modal-backdrop.visible { opacity: 1; }
    .modal-card {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 22px;
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 24px 70px rgba(20, 31, 54, .24);
      transform: translateY(10px) scale(.98);
      transition: transform .18s ease;
    }
    .modal-backdrop.visible .modal-card {
      transform: translateY(0) scale(1);
    }
    .modal-mark {
      width: 42px;
      height: 42px;
      margin-bottom: 17px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: var(--danger);
      background: #fff0f2;
      font-size: 22px;
      font-weight: 500;
    }
    .modal-card h2 { margin: 0; font-size: 19px; }
    .modal-card p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .delete-session-name {
      display: block;
      margin-top: 13px;
      padding: 11px 13px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: #f8faff;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-error {
      min-height: 20px;
      margin-top: 9px;
      color: var(--danger);
      font-size: 12px;
    }
    .modal-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }
    .modal-button {
      min-width: 86px;
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 11px;
      font-weight: 600;
    }
    .modal-button.cancel {
      color: var(--ink);
      background: #eef2f8;
    }
    .modal-button.cancel:hover { background: #e4eaf4; }
    .modal-button.danger {
      color: white;
      background: #d63c50;
      box-shadow: 0 8px 18px rgba(214, 60, 80, .2);
    }
    .modal-button.danger:hover { background: #c93246; }
    @media (max-width: 720px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 250px minmax(0, 1fr);
      }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .session-list {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .session-item { min-width: 210px; }
      .session-actions { opacity: 1; }
      .messages { padding: 20px 14px; }
      .bubble { max-width: 92%; }
      .booking-card-body { grid-template-columns: 1fr; }
      .booking-field.wide,
      .booking-actions,
      .booking-feedback,
      .booking-proof { grid-column: 1; }
      .booking-actions { align-items: stretch; flex-direction: column-reverse; }
      .booking-action { width: 100%; }
      .chat-header { padding: 13px 16px; }
      .chat-header p { display: none; }
      .model-caption { display: none; }
      .model-trigger {
        min-width: 0;
        max-width: min(210px, 58vw);
      }
      .model-menu {
        position: fixed;
        top: 70px;
        right: 12px;
        left: 12px;
        width: auto;
        max-height: calc(100dvh - 88px);
        overflow-y: auto;
      }
      .provider-item::after { display: none; }
      .model-submenu {
        position: static;
        display: none;
        width: auto;
        max-height: 260px;
        margin: 2px 4px 7px 18px;
        box-shadow: none;
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }
      .provider-item.active > .model-submenu,
      .provider-item:focus-within > .model-submenu {
        display: block;
      }
      .provider-item.active .provider-chevron {
        transform: rotate(90deg);
      }
      .composer { padding: 12px 14px 14px; }
      .send-button { min-width: 64px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .messages { scroll-behavior: auto; }
      .send-button,
      .session-actions { transition: none; }
    }
  </style>
</head>

<script>
  const currentSessionKey = "xiaoyuan-current-session";
  const selectedModelKey = "xiaoyuan-selected-model";
  const sessionList = document.querySelector("#sessionList");
  const sandboxNav = document.querySelector("#sandboxNav");
  const meetingRoomSandboxNav = document.querySelector("#meetingRoomSandboxNav");
  const messages = document.querySelector("#messages");
  const chatTitle = document.querySelector("#chatTitle");
  const form = document.querySelector("#composer");
  const input = document.querySelector("#input");
  const sendButton = document.querySelector("#send");
  const modelPicker = document.querySelector("#modelPicker");
  const modelTrigger = document.querySelector("#modelTrigger");
  const modelMenu = document.querySelector("#modelMenu");
  const currentProvider = document.querySelector("#currentProvider");
  const currentModel = document.querySelector("#currentModel");
  const deleteModal = document.querySelector("#deleteModal");
  const deleteSessionName = document.querySelector("#deleteSessionName");
  const deleteModalError = document.querySelector("#deleteModalError");
  const cancelDeleteButton = document.querySelector("#cancelDelete");
  const confirmDeleteButton = document.querySelector("#confirmDelete");

  let sessions = [];
  let modelOptions = [];
  let selectedModelId = null;
  let currentSessionId = localStorage.getItem(currentSessionKey);
  let sending = false;
  let pendingDeleteSession = null;
  let modalReturnFocus = null;
  let modalDeleting = false;

  async function revealSandboxNavigation() {
    try {
      const response = await fetch("/api/sandbox/status");
      const hidden = !response.ok;
      sandboxNav.hidden = hidden;
      meetingRoomSandboxNav.hidden = hidden;
    } catch (_error) {
      sandboxNav.hidden = true;
      meetingRoomSandboxNav.hidden = true;
    }
  }

  async function api(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "请求失败");
    return data;
  }

  function appendInlineMarkdown(parent, source) {
    const tokenPattern =
      /(`+)([\s\S]*?)\1|\*\*([\s\S]+?)\*\*|__([\s\S]+?)__|~~([\s\S]+?)~~|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|\*([^*\n]+)\*|_([^_\n]+)_/g;
    let cursor = 0;
    let match;

    while ((match = tokenPattern.exec(source)) !== null) {
      if (match.index > cursor) {
        parent.appendChild(document.createTextNode(source.slice(cursor, match.index)));
      }

      if (match[1]) {
        const code = document.createElement("code");
        code.textContent = match[2];
        parent.appendChild(code);
      } else if (match[3] || match[4]) {
        const strong = document.createElement("strong");
        appendInlineMarkdown(strong, match[3] || match[4]);
        parent.appendChild(strong);
      } else if (match[5]) {
        const deleted = document.createElement("del");
        appendInlineMarkdown(deleted, match[5]);
        parent.appendChild(deleted);
      } else if (match[6] && match[7]) {
        const link = document.createElement("a");
        link.href = match[7];
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        appendInlineMarkdown(link, match[6]);
        parent.appendChild(link);
      } else if (match[8] || match[9]) {
        const emphasis = document.createElement("em");
        appendInlineMarkdown(emphasis, match[8] || match[9]);
        parent.appendChild(emphasis);
      }

      cursor = tokenPattern.lastIndex;
    }

    if (cursor < source.length) {
      parent.appendChild(document.createTextNode(source.slice(cursor)));
    }
  }

  function splitTableRow(line) {
    let value = line.trim();
    if (value.startsWith("|")) value = value.slice(1);
    if (value.endsWith("|")) value = value.slice(0, -1);

    const cells = [];
    let cell = "";
    let escaped = false;
    for (const character of value) {
      if (escaped) {
        cell += character === "|" ? "|" : `\\${character}`;
        escaped = false;
      } else if (character === "\\") {
        escaped = true;
      } else if (character === "|") {
        cells.push(cell.trim());
        cell = "";
      } else {
        cell += character;
      }
    }
    if (escaped) cell += "\\";
    cells.push(cell.trim());
    return cells;
  }

  function isTableDivider(line) {
    const cells = splitTableRow(line);
    return cells.length > 1 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
  }

  function isBlockStart(lines, index) {
    const line = lines[index] || "";
    if (!line.trim()) return true;
    if (/^\s*(```|~~~)/.test(line)) return true;
    if (/^\s{0,3}#{1,6}\s+/.test(line)) return true;
    if (/^\s{0,3}>\s?/.test(line)) return true;
    if (/^\s*[-+*]\s+/.test(line)) return true;
    if (/^\s*\d+\.\s+/.test(line)) return true;
    if (/^\s{0,3}((\*\s*){3,}|(-\s*){3,}|(_\s*){3,})$/.test(line)) {
      return true;
    }
    return index + 1 < lines.length && line.includes("|")
      && isTableDivider(lines[index + 1]);
  }

  function renderMarkdown(text) {
    const fragment = document.createDocumentFragment();
    const lines = String(text).replace(/\r\n?/g, "\n").split("\n");
    let index = 0;

    while (index < lines.length) {
      const line = lines[index];
      if (!line.trim()) {
        index += 1;
        continue;
      }

      const fence = line.match(/^\s*(```|~~~)\s*([\w+-]*)\s*$/);
      if (fence) {
        const fenceMark = fence[1];
        const codeLines = [];
        index += 1;
        while (index < lines.length && !lines[index].trimStart().startsWith(fenceMark)) {
          codeLines.push(lines[index]);
          index += 1;
        }
        if (index < lines.length) index += 1;
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        if (fence[2]) code.className = `language-${fence[2].toLowerCase()}`;
        code.textContent = codeLines.join("\n");
        pre.appendChild(code);
        fragment.appendChild(pre);
        continue;
      }

      const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
      if (heading) {
        const element = document.createElement(`h${heading[1].length}`);
        appendInlineMarkdown(element, heading[2]);
        fragment.appendChild(element);
        index += 1;
        continue;
      }

      if (/^\s{0,3}((\*\s*){3,}|(-\s*){3,}|(_\s*){3,})$/.test(line)) {
        fragment.appendChild(document.createElement("hr"));
        index += 1;
        continue;
      }

      if (/^\s{0,3}>\s?/.test(line)) {
        const quoteLines = [];
        while (index < lines.length && /^\s{0,3}>\s?/.test(lines[index])) {
          quoteLines.push(lines[index].replace(/^\s{0,3}>\s?/, ""));
          index += 1;
        }
        const blockquote = document.createElement("blockquote");
        blockquote.appendChild(renderMarkdown(quoteLines.join("\n")));
        fragment.appendChild(blockquote);
        continue;
      }

      const unordered = line.match(/^\s*[-+*]\s+(.+)/);
      const ordered = line.match(/^\s*\d+\.\s+(.+)/);
      if (unordered || ordered) {
        const list = document.createElement(unordered ? "ul" : "ol");
        const itemPattern = unordered ? /^\s*[-+*]\s+(.+)/ : /^\s*\d+\.\s+(.+)/;
        while (index < lines.length) {
          const item = lines[index].match(itemPattern);
          if (!item) break;
          const listItem = document.createElement("li");
          appendInlineMarkdown(listItem, item[1]);
          list.appendChild(listItem);
          index += 1;
        }
        fragment.appendChild(list);
        continue;
      }

      if (
        index + 1 < lines.length
        && line.includes("|")
        && isTableDivider(lines[index + 1])
      ) {
        const headings = splitTableRow(line);
        const alignments = splitTableRow(lines[index + 1]).map(cell => {
          if (cell.startsWith(":") && cell.endsWith(":")) return "center";
          if (cell.endsWith(":")) return "right";
          return "left";
        });
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        const table = document.createElement("table");
        const tableHead = document.createElement("thead");
        const headRow = document.createElement("tr");
        headings.forEach((content, cellIndex) => {
          const cell = document.createElement("th");
          cell.style.textAlign = alignments[cellIndex] || "left";
          appendInlineMarkdown(cell, content);
          headRow.appendChild(cell);
        });
        tableHead.appendChild(headRow);
        table.appendChild(tableHead);
        index += 2;

        const tableBody = document.createElement("tbody");
        while (index < lines.length && lines[index].trim() && lines[index].includes("|")) {
          const row = document.createElement("tr");
          splitTableRow(lines[index]).forEach((content, cellIndex) => {
            const cell = document.createElement("td");
            cell.style.textAlign = alignments[cellIndex] || "left";
            appendInlineMarkdown(cell, content);
            row.appendChild(cell);
          });
          tableBody.appendChild(row);
          index += 1;
        }
        table.appendChild(tableBody);
        wrap.appendChild(table);
        fragment.appendChild(wrap);
        continue;
      }

      const paragraphLines = [line];
      index += 1;
      while (index < lines.length && lines[index].trim() && !isBlockStart(lines, index)) {
        paragraphLines.push(lines[index]);
        index += 1;
      }
      const paragraph = document.createElement("p");
      paragraphLines.forEach((content, lineIndex) => {
        if (lineIndex) paragraph.appendChild(document.createElement("br"));
        appendInlineMarkdown(paragraph, content);
      });
      fragment.appendChild(paragraph);
    }

    return fragment;
  }

  function bookingCalendarIcon() {
    const namespace = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(namespace, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS(namespace, "path");
    path.setAttribute(
      "d",
      "M6 3v3m12-3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm3 8h6m-6 4h4"
    );
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("stroke-width", "1.7");
    path.setAttribute("stroke-linecap", "round");
    svg.appendChild(path);
    return svg;
  }

  function appendBookingField(grid, labelText, control, {wide = false} = {}) {
    const field = document.createElement("div");
    field.className = `booking-field${wide ? " wide" : ""}`;
    const label = document.createElement("label");
    label.textContent = labelText;
    label.htmlFor = control.id;
    field.append(label, control);
    grid.appendChild(field);
    return field;
  }

  function timeSelect(id, value, {allowEnd = false} = {}) {
    const select = document.createElement("select");
    select.id = id;
    const finalMinute = allowEnd ? 18 * 60 : 17 * 60 + 30;
    for (let minute = 9 * 60; minute <= finalMinute; minute += 30) {
      const hour = String(Math.floor(minute / 60)).padStart(2, "0");
      const part = String(minute % 60).padStart(2, "0");
      const option = document.createElement("option");
      option.value = `${hour}:${part}`;
      option.textContent = option.value;
      option.selected = option.value === value;
      select.appendChild(option);
    }
    return select;
  }

  function shanghaiTodayInputValue() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Shanghai",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(new Date());
    const values = Object.fromEntries(
      parts.map(part => [part.type, part.value])
    );
    return `${values.year}-${values.month}-${values.day}`;
  }

  function bookingDraftPayload(controls) {
    return {
      roomId: controls.room.value,
      floor: controls.floor.value,
      date: controls.date.value.replaceAll("-", "/"),
      timeRange: `${controls.start.value}-${controls.end.value}`,
      capacity: Number(controls.capacity.value),
      theme: controls.theme.value.trim() || null,
    };
  }

  function setBookingControlsDisabled(controls, disabled) {
    Object.values(controls).forEach(control => {
      control.disabled = disabled;
    });
  }

  function renderBookingCard(host, draft) {
    host.replaceChildren();
    const card = document.createElement("section");
    card.className = "booking-card";
    card.dataset.draftId = draft.draftId;
    card.setAttribute("aria-label", "会议室预约确认卡片");

    const head = document.createElement("div");
    head.className = "booking-card-head";
    const title = document.createElement("div");
    title.className = "booking-card-title";
    title.append(bookingCalendarIcon(), document.createTextNode("会议室预约"));
    const status = document.createElement("span");
    const statusText = {
      pending: "等待你确认",
      confirmed: "预约成功",
      expired: "已过期",
      cancelled: "已取消",
    };
    status.className = `booking-status ${draft.status || "pending"}`;
    status.textContent = statusText[draft.status] || "等待你确认";
    head.append(title, status);

    const body = document.createElement("div");
    body.className = "booking-card-body";
    const unique = draft.draftId.slice(0, 8);
    const floor = document.createElement("select");
    floor.id = `booking-floor-${unique}`;
    ["6", "7", "8"].forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = `${value}F`;
      option.selected = value === String(draft.floor);
      floor.appendChild(option);
    });

    const room = document.createElement("select");
    room.id = `booking-room-${unique}`;
    const currentRoom = document.createElement("option");
    currentRoom.value = draft.roomId;
    currentRoom.textContent = draft.roomName;
    room.appendChild(currentRoom);

    const date = document.createElement("input");
    date.id = `booking-date-${unique}`;
    date.type = "date";
    date.min = shanghaiTodayInputValue();
    date.value = draft.date.replaceAll("/", "-");

    const [startValue, endValue] = draft.timeRange.split("-");
    const start = timeSelect(`booking-start-${unique}`, startValue);
    const end = timeSelect(
      `booking-end-${unique}`,
      endValue,
      {allowEnd: true}
    );

    const capacity = document.createElement("input");
    capacity.id = `booking-capacity-${unique}`;
    capacity.type = "number";
    capacity.min = "1";
    capacity.max = "500";
    capacity.value = draft.capacity;

    const theme = document.createElement("input");
    theme.id = `booking-theme-${unique}`;
    theme.maxLength = 100;
    theme.value = draft.theme || "";

    appendBookingField(body, "楼层", floor);
    appendBookingField(body, "日期", date);
    const roomField = document.createElement("div");
    roomField.className = "booking-field wide";
    const roomLabel = document.createElement("label");
    roomLabel.htmlFor = room.id;
    roomLabel.textContent = "会议室";
    const roomLine = document.createElement("div");
    roomLine.className = "booking-room-line";
    const refresh = document.createElement("button");
    refresh.className = "booking-refresh";
    refresh.type = "button";
    refresh.textContent = "刷新可用";
    roomLine.append(room, refresh);
    roomField.append(roomLabel, roomLine);
    body.appendChild(roomField);
    appendBookingField(body, "开始时间", start);
    appendBookingField(body, "结束时间", end);
    appendBookingField(body, "参会人数", capacity);
    appendBookingField(body, "会议主题", theme);

    const feedback = document.createElement("div");
    feedback.className = "booking-feedback";
    feedback.setAttribute("aria-live", "polite");
    feedback.textContent = "检查参数后由你本人确认，模型无法代替点击。";
    body.appendChild(feedback);

    const actions = document.createElement("div");
    actions.className = "booking-actions";
    const save = document.createElement("button");
    save.className = "booking-action save";
    save.type = "button";
    save.textContent = "保存修改";
    const confirm = document.createElement("button");
    confirm.className = "booking-action confirm";
    confirm.type = "button";
    confirm.textContent = "确认预约";
    actions.append(save, confirm);
    body.appendChild(actions);

    const controls = {floor, room, date, start, end, capacity, theme};
    const locked = draft.status !== "pending";
    if (locked) {
      card.classList.add("is-locked");
      setBookingControlsDisabled(controls, true);
      refresh.disabled = true;
      save.disabled = true;
      confirm.disabled = true;
    }
    if (draft.status === "confirmed") {
      const proof = document.createElement("div");
      proof.className = "booking-proof";
      proof.textContent =
        `预约编号 ${draft.meetingId} · ${draft.roomName} · ` +
        `${draft.date} ${draft.timeRange}`;
      body.insertBefore(proof, actions);
      feedback.textContent = "预约已由服务端真实写入。";
    } else if (locked) {
      feedback.textContent = "该卡片已失效，请在对话中重新发起预约。";
    }

    async function saveDraft({silent = false} = {}) {
      feedback.classList.remove("error");
      feedback.textContent = silent ? "正在校验并确认…" : "正在保存并校验…";
      save.disabled = true;
      confirm.disabled = true;
      try {
        const updated = await api(
          `/api/meeting-room-booking-drafts/${draft.draftId}`,
          {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(bookingDraftPayload(controls)),
          }
        );
        if (!silent) renderBookingCard(host, updated);
        return updated;
      } catch (error) {
        feedback.classList.add("error");
        feedback.textContent = error.message;
        save.disabled = false;
        confirm.disabled = false;
        throw error;
      }
    }

    refresh.addEventListener("click", async () => {
      feedback.classList.remove("error");
      feedback.textContent = "正在查询当前条件下的会议室…";
      refresh.disabled = true;
      const payload = bookingDraftPayload(controls);
      const params = new URLSearchParams({
        floor: payload.floor,
        date: payload.date,
        timeRange: payload.timeRange,
        capacity: String(payload.capacity),
      });
      try {
        const result = await api(
          `/api/meeting-room-booking-drafts/${draft.draftId}/room-options?${params}`
        );
        room.replaceChildren();
        result.rooms.forEach(candidate => {
          const option = document.createElement("option");
          option.value = candidate.roomId;
          option.textContent =
            `${candidate.roomName} · ${candidate.capacity}人` +
            (candidate.available ? "" : " · 不可用");
          option.disabled = !candidate.available;
          option.selected = candidate.roomId === draft.roomId;
          room.appendChild(option);
        });
        const firstAvailable = [...room.options].find(option => !option.disabled);
        if (!room.value && firstAvailable) firstAvailable.selected = true;
        feedback.textContent = firstAvailable
          ? "已按当前条件刷新，请选择可用会议室。"
          : "当前条件下没有可用会议室。";
      } catch (error) {
        feedback.classList.add("error");
        feedback.textContent = error.message;
      } finally {
        refresh.disabled = false;
      }
    });

    save.addEventListener("click", () => saveDraft().catch(() => {}));
    confirm.addEventListener("click", async () => {
      try {
        await saveDraft({silent: true});
        const result = await api(
          `/api/meeting-room-booking-drafts/${draft.draftId}/confirm`,
          {method: "POST"}
        );
        renderBookingCard(host, result.draft);
      } catch (error) {
        // saveDraft or the confirm endpoint has already supplied a safe message.
        if (!feedback.classList.contains("error")) {
          feedback.classList.add("error");
          feedback.textContent = error.message || "确认失败，请检查参数后重试。";
          save.disabled = false;
          confirm.disabled = false;
        }
      }
    });

    card.append(head, body);
    host.appendChild(card);
  }

  function renderMessageContent(bubble, text, role, artifacts = []) {
    bubble.replaceChildren();
    if (role === "assistant") {
      bubble.appendChild(renderMarkdown(text));
      artifacts
        .filter(artifact => artifact.type === "meetingRoomBookingDraft")
        .forEach(artifact => {
          const host = document.createElement("div");
          host.className = "booking-card-host";
          bubble.appendChild(host);
          renderBookingCard(host, artifact);
        });
    } else {
      bubble.textContent = text;
    }
  }

  function appendMessage(text, role, artifacts = []) {
    messages.querySelector(".welcome")?.remove();
    const row = document.createElement("div");
    row.className = `row ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    renderMessageContent(bubble, text, role, artifacts);
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function actionIcon(type) {
    const namespace = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(namespace, "svg");
    svg.setAttribute("viewBox", "0 0 20 20");
    svg.setAttribute("fill", "none");
    svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS(namespace, "path");
    path.setAttribute(
      "d",
      type === "rename"
        ? "M4 14.5V16h1.5L15.9 5.6a1.06 1.06 0 0 0 0-1.5 1.06 1.06 0 0 0-1.5 0L4 14.5Zm8.9-8.9 1.5 1.5"
        : "M4.5 6h11M8 6V4.5h4V6m-6 0 .65 10h6.7L14 6M8.5 9v4m3-4v4"
    );
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("stroke-width", "1.5");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    svg.appendChild(path);
    return svg;
  }

  function renderSessions() {
    sessionList.replaceChildren();
    const newItem = document.createElement("div");
    newItem.className = "session-item new-session";
    if (!currentSessionId) newItem.classList.add("active");
    const newMain = document.createElement("div");
    newMain.className = "session-main";
    newMain.tabIndex = 0;
    newMain.setAttribute("role", "button");
    const newTitle = document.createElement("span");
    newTitle.className = "session-title";
    newTitle.textContent = "＋ 新对话";
    const newMeta = document.createElement("span");
    newMeta.className = "session-meta";
    newMeta.textContent = "发送第一条消息后保存";
    newMain.append(newTitle, newMeta);
    newMain.addEventListener("click", showNewConversation);
    newMain.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        showNewConversation();
      }
    });
    newItem.appendChild(newMain);
    sessionList.appendChild(newItem);

    for (const session of sessions) {
      const item = document.createElement("div");
      item.className = "session-item";
      if (session.sessionId === currentSessionId) item.classList.add("active");

      const main = document.createElement("div");
      main.className = "session-main";
      main.tabIndex = 0;
      main.setAttribute("role", "button");
      const title = document.createElement("span");
      title.className = "session-title";
      title.textContent = session.title;
      const meta = document.createElement("span");
      meta.className = "session-meta";
      meta.textContent = session.rounds ? `${session.rounds} 轮对话` : "尚未开始";
      main.append(title, meta);
      main.addEventListener("click", () => switchSession(session.sessionId));
      main.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          switchSession(session.sessionId);
        }
      });

      const actions = document.createElement("div");
      actions.className = "session-actions";
      const rename = document.createElement("button");
      rename.className = "icon-button";
      rename.type = "button";
      rename.title = "重命名";
      rename.setAttribute("aria-label", `重命名“${session.title}”`);
      rename.appendChild(actionIcon("rename"));
      rename.addEventListener("click", () => beginRename(session, title));
      const remove = document.createElement("button");
      remove.className = "icon-button delete";
      remove.type = "button";
      remove.title = "删除";
      remove.setAttribute("aria-label", `删除“${session.title}”`);
      remove.appendChild(actionIcon("delete"));
      remove.addEventListener("click", () => openDeleteModal(session, remove));
      actions.append(rename, remove);

      item.append(main, actions);
      sessionList.appendChild(item);
    }
  }

  async function refreshSessions() {
    sessions = await api("/api/sessions");
    renderSessions();
  }

  async function loadModels() {
    const catalog = await api("/api/models");
    modelOptions = catalog.filter(model => model.callable);
    if (!modelOptions.length) {
      throw new Error("没有已配置且可调用的模型");
    }

    const savedModel = localStorage.getItem(selectedModelKey);
    const selected = modelOptions.find(model => model.id === savedModel)
      || modelOptions.find(model => model.default)
      || modelOptions[0];
    selectedModelId = selected.id;
    renderModelMenu();
    selectModel(selected.id);
  }

  function renderModelMenu() {
    modelMenu.replaceChildren();
    const groups = new Map();
    for (const model of modelOptions) {
      const group = groups.get(model.providerId) || {
        id: model.providerId,
        label: model.provider,
        models: [],
      };
      group.models.push(model);
      groups.set(model.providerId, group);
    }

    for (const group of groups.values()) {
      const providerItem = document.createElement("div");
      providerItem.className = "provider-item";
      providerItem.dataset.providerId = group.id;

      const providerButton = document.createElement("button");
      providerButton.className = "provider-button";
      providerButton.type = "button";
      providerButton.setAttribute("role", "menuitem");
      providerButton.setAttribute("aria-haspopup", "menu");
      providerButton.setAttribute("aria-expanded", "false");

      const dot = document.createElement("span");
      dot.className = "provider-dot";
      dot.setAttribute("aria-hidden", "true");
      const copy = document.createElement("span");
      copy.className = "provider-copy";
      const name = document.createElement("span");
      name.className = "provider-name";
      name.textContent = group.label;
      const count = document.createElement("span");
      count.className = "provider-count";
      count.textContent = `${group.models.length} 个模型`;
      copy.append(name, count);
      providerButton.append(dot, copy, chevronIcon("right", "provider-chevron"));

      const submenu = document.createElement("div");
      submenu.className = "model-submenu";
      submenu.setAttribute("role", "menu");
      submenu.setAttribute("aria-label", `${group.label} 模型`);
      submenu.hidden = true;

      for (const model of group.models) {
        const option = document.createElement("button");
        option.className = "model-option";
        option.type = "button";
        option.dataset.modelId = model.id;
        option.setAttribute("role", "menuitemradio");
        option.setAttribute("aria-checked", String(model.id === selectedModelId));

        const optionName = document.createElement("span");
        optionName.className = "model-option-name";
        optionName.textContent = model.label;
        const optionStatus = document.createElement("span");
        optionStatus.className = "model-option-status";
        optionStatus.textContent = modelStatus(model);
        option.append(optionName, optionStatus);
        option.addEventListener("click", () => {
          selectModel(model.id);
          closeModelMenu({restoreFocus: true});
        });
        option.addEventListener("keydown", event => {
          handleModelOptionKeydown(event, option, providerButton);
        });
        submenu.appendChild(option);
      }

      providerButton.addEventListener("click", () => {
        activateProvider(providerItem);
      });
      providerButton.addEventListener("keydown", event => {
        handleProviderKeydown(event, providerItem);
      });
      providerItem.addEventListener("pointerenter", () => {
        activateProvider(providerItem);
      });
      providerItem.append(providerButton, submenu);
      modelMenu.appendChild(providerItem);
    }
  }

  function chevronIcon(direction, className) {
    const namespace = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(namespace, "svg");
    svg.classList.add(className);
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("fill", "none");
    svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS(namespace, "path");
    path.setAttribute("d", direction === "right" ? "m6 4 4 4-4 4" : "m4 6 4 4 4-4");
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("stroke-width", "1.5");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    svg.appendChild(path);
    return svg;
  }

  function modelStatus(model) {
    if (model.providerId === "ollama") return "本地";
    if (model.source === "cached") return "缓存";
    if (model.source === "fallback") return "兜底";
    return model.discovered ? "在线" : "配置";
  }

  function selectModel(modelId) {
    const selected = modelOptions.find(model => model.id === modelId);
    if (!selected) return;
    selectedModelId = selected.id;
    currentProvider.textContent = selected.provider;
    currentModel.textContent = selected.label;
    modelTrigger.title = `${selected.provider} / ${selected.label}`;
    localStorage.setItem(selectedModelKey, selected.id);

    for (const option of modelMenu.querySelectorAll(".model-option")) {
      const isSelected = option.dataset.modelId === selected.id;
      option.classList.toggle("selected", isSelected);
      option.setAttribute("aria-checked", String(isSelected));
    }
  }

  function activateProvider(providerItem) {
    for (const item of modelMenu.querySelectorAll(".provider-item")) {
      const isActive = item === providerItem;
      item.classList.toggle("active", isActive);
      item.querySelector(".provider-button")
        ?.setAttribute("aria-expanded", String(isActive));
      const submenu = item.querySelector(".model-submenu");
      if (submenu) submenu.hidden = !isActive;
    }
  }

  function openModelMenu({focusProvider = false} = {}) {
    if (modelTrigger.disabled || !modelOptions.length) return;
    modelMenu.hidden = false;
    modelTrigger.setAttribute("aria-expanded", "true");
    const selected = modelOptions.find(model => model.id === selectedModelId);
    const activeItem = [...modelMenu.querySelectorAll(".provider-item")].find(
      item => item.dataset.providerId === selected?.providerId
    ) || modelMenu.querySelector(".provider-item");
    if (activeItem) {
      activateProvider(activeItem);
      if (focusProvider) activeItem.querySelector(".provider-button")?.focus();
    }
  }

  function closeModelMenu({restoreFocus = false} = {}) {
    modelMenu.hidden = true;
    modelTrigger.setAttribute("aria-expanded", "false");
    if (restoreFocus) modelTrigger.focus();
  }

  function handleProviderKeydown(event, providerItem) {
    const providers = [...modelMenu.querySelectorAll(".provider-button")];
    const currentIndex = providers.indexOf(event.currentTarget);
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      const offset = event.key === "ArrowDown" ? 1 : -1;
      providers[(currentIndex + offset + providers.length) % providers.length].focus();
    } else if (event.key === "ArrowRight" || event.key === "Enter") {
      event.preventDefault();
      activateProvider(providerItem);
      providerItem.querySelector(".model-option")?.focus();
    } else if (event.key === "Escape") {
      event.preventDefault();
      closeModelMenu({restoreFocus: true});
    }
  }

  function handleModelOptionKeydown(event, option, providerButton) {
    const options = [...option.parentElement.querySelectorAll(".model-option")];
    const currentIndex = options.indexOf(option);
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      const offset = event.key === "ArrowDown" ? 1 : -1;
      options[(currentIndex + offset + options.length) % options.length].focus();
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      providerButton.focus();
    } else if (event.key === "Escape") {
      event.preventDefault();
      closeModelMenu({restoreFocus: true});
    }
  }

  modelTrigger.addEventListener("click", () => {
    if (modelMenu.hidden) {
      openModelMenu();
    } else {
      closeModelMenu();
    }
  });
  modelTrigger.addEventListener("keydown", event => {
    if (event.key === "ArrowDown") {
      event.preventDefault();
      openModelMenu({focusProvider: true});
    } else if (event.key === "Escape" && !modelMenu.hidden) {
      event.preventDefault();
      closeModelMenu();
    }
  });
  document.addEventListener("pointerdown", event => {
    if (!modelMenu.hidden && !modelPicker.contains(event.target)) {
      closeModelMenu();
    }
  });

  function showNewConversation() {
    if (sending) return;
    currentSessionId = null;
    localStorage.removeItem(currentSessionKey);
    chatTitle.textContent = "新对话";
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.textContent = "发送第一条消息后，这个对话才会被保存。";
    messages.replaceChildren(welcome);
    renderSessions();
    input.focus();
  }

  async function switchSession(sessionId) {
    if (sending) return;
    currentSessionId = sessionId;
    localStorage.setItem(currentSessionKey, sessionId);
    renderSessions();
    const context = await api(`/api/sessions/${sessionId}`);
    chatTitle.textContent = context.title;
    messages.replaceChildren();
    if (!context.messages.length) {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.textContent = "新对话已准备好，给小原发一条消息吧。";
      messages.appendChild(welcome);
    } else {
      for (const message of context.messages) {
        const artifacts = message.role === "assistant"
          ? (context.artifactsByRound?.[message.round] || [])
          : [];
        appendMessage(message.content, message.role, artifacts);
      }
    }
    messages.scrollTop = messages.scrollHeight;
  }

  function beginRename(session, titleElement) {
    if (sending) return;
    const editor = document.createElement("input");
    editor.className = "session-title-input";
    editor.value = session.title;
    editor.maxLength = 80;
    editor.setAttribute("aria-label", "修改会话名称");
    titleElement.replaceWith(editor);
    editor.focus();
    editor.setSelectionRange(editor.value.length, editor.value.length);

    let finished = false;
    async function finish(save) {
      if (finished) return;
      const nextTitle = editor.value.trim();
      if (save && !nextTitle) {
        editor.classList.add("error");
        editor.focus();
        return;
      }
      finished = true;
      if (!save || nextTitle === session.title) {
        renderSessions();
        return;
      }
      try {
        await api(`/api/sessions/${session.sessionId}`, {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({title: nextTitle}),
        });
        await refreshSessions();
        if (session.sessionId === currentSessionId) {
          chatTitle.textContent = nextTitle;
        }
      } catch (error) {
        finished = false;
        editor.classList.add("error");
        editor.focus();
      }
    }

    editor.addEventListener("click", event => event.stopPropagation());
    editor.addEventListener("keydown", event => {
      event.stopPropagation();
      if (event.key === "Enter") {
        event.preventDefault();
        finish(true);
      } else if (event.key === "Escape") {
        event.preventDefault();
        finish(false);
      }
    });
    editor.addEventListener("blur", () => finish(true));
  }

  function openDeleteModal(session, trigger) {
    if (sending) return;
    pendingDeleteSession = session;
    modalReturnFocus = trigger;
    deleteSessionName.textContent = session.title;
    deleteModalError.textContent = "";
    modalDeleting = false;
    cancelDeleteButton.disabled = false;
    confirmDeleteButton.disabled = false;
    confirmDeleteButton.textContent = "删除会话";
    deleteModal.hidden = false;
    requestAnimationFrame(() => deleteModal.classList.add("visible"));
    cancelDeleteButton.focus();
  }

  function closeDeleteModal() {
    if (deleteModal.hidden || modalDeleting) return;
    deleteModal.classList.remove("visible");
    const returnFocus = modalReturnFocus;
    pendingDeleteSession = null;
    modalReturnFocus = null;
    setTimeout(() => {
      deleteModal.hidden = true;
      returnFocus?.focus();
    }, 180);
  }

  async function confirmDeleteSession() {
    if (!pendingDeleteSession) return;
    const session = pendingDeleteSession;
    modalDeleting = true;
    confirmDeleteButton.disabled = true;
    cancelDeleteButton.disabled = true;
    confirmDeleteButton.textContent = "正在删除…";
    deleteModalError.textContent = "";
    const deletingCurrent = session.sessionId === currentSessionId;
    try {
      await api(`/api/sessions/${session.sessionId}`, {method: "DELETE"});
      if (deletingCurrent) currentSessionId = null;
      await refreshSessions();
      modalDeleting = false;
      closeDeleteModal();
      if (deletingCurrent) showNewConversation();
    } catch (error) {
      modalDeleting = false;
      deleteModalError.textContent = error.message;
      confirmDeleteButton.disabled = false;
      cancelDeleteButton.disabled = false;
      confirmDeleteButton.textContent = "删除会话";
    }
  }

  cancelDeleteButton.addEventListener("click", closeDeleteModal);
  confirmDeleteButton.addEventListener("click", confirmDeleteSession);
  deleteModal.addEventListener("click", event => {
    if (event.target === deleteModal) closeDeleteModal();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !deleteModal.hidden) {
      closeDeleteModal();
    }
    if (event.key === "Tab" && !deleteModal.hidden) {
      const first = cancelDeleteButton;
      const last = confirmDeleteButton;
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || sending) return;

    sending = true;
    sendButton.disabled = true;
    modelTrigger.disabled = true;
    closeModelMenu();
    input.value = "";
    appendMessage(text, "user");
    const pending = appendMessage("正在思考…", "assistant");
    try {
      const payload = {message: text, model: selectedModelId};
      if (currentSessionId) payload.sessionId = currentSessionId;
      const result = await api("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      currentSessionId = result.sessionId;
      localStorage.setItem(currentSessionKey, currentSessionId);
      renderMessageContent(
        pending.querySelector(".bubble"),
        result.reply,
        "assistant",
        result.artifacts || []
      );
      messages.scrollTop = messages.scrollHeight;
      chatTitle.textContent = result.title;
      await refreshSessions();
    } catch (error) {
      pending.classList.add("message-error");
      renderMessageContent(
        pending.querySelector(".bubble"),
        `出错了：${error.message}`,
        "assistant"
      );
    } finally {
      sending = false;
      sendButton.disabled = false;
      modelTrigger.disabled = false;
      input.focus();
    }
  });

  (async () => {
    try {
      revealSandboxNavigation();
      await Promise.all([loadModels(), refreshSessions()]);
      const savedSessionExists = sessions.some(
        session => session.sessionId === currentSessionId
      );
      if (savedSessionExists) {
        await switchSession(currentSessionId);
      } else {
        showNewConversation();
      }
    } catch (error) {
      const failure = document.createElement("div");
      failure.className = "welcome";
      failure.textContent = `加载失败：${error.message}`;
      messages.replaceChildren(failure);
    }
  })();
</script>
</body>
</html>
