<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小原 AI 助手</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #2867f0;
      --blue-soft: #edf3ff;
      --ink: #182033;
      --muted: #68738a;
      --line: #e2e8f2;
      --panel: rgba(255, 255, 255, .92);
      --sidebar: #f7f9fd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: var(--ink);
      background: linear-gradient(150deg, #f6f9ff, #e9effa);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app {
      width: min(1180px, 100%);
      height: 100vh;
      margin: auto;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      background: var(--panel);
      border-inline: 1px solid var(--line);
    }
    .sidebar {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }
    .sidebar-header {
      padding: 18px 16px 14px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .sidebar-header h2 { margin: 0; font-size: 15px; }
    .session-list {
      min-height: 0;
      overflow-y: auto;
      padding: 10px 8px;
    }
    .session-item {
      margin-bottom: 4px;
      padding: 4px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      border-radius: 11px;
      color: var(--ink);
    }
    .session-item:hover { background: #eef2f8; }
    .session-item.active {
      color: var(--blue);
      background: var(--blue-soft);
    }
    .session-item.new-session {
      margin-bottom: 10px;
      border: 1px solid var(--line);
      background: white;
    }
    .session-item.new-session.active {
      border-color: #bfd1fb;
      background: var(--blue-soft);
    }
    .session-main {
      min-width: 0;
      padding: 8px;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .session-title {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-title-input {
      display: block;
      width: 100%;
      height: 24px;
      padding: 2px 5px;
      border: 1px solid var(--blue);
      border-radius: 6px;
      outline: none;
      color: var(--ink);
      background: white;
      font-size: 13px;
      font-weight: 600;
    }
    .session-title-input.error { border-color: #d33b4d; }
    .session-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }
    .session-actions {
      display: flex;
      opacity: 0;
    }
    .session-item:hover .session-actions,
    .session-item.active .session-actions { opacity: 1; }
    .icon-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
    }
    .icon-button:hover { color: var(--blue); background: white; }
    .icon-button.delete:hover { color: #d33b4d; }
    .chat {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .chat-header {
      padding: 17px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .chat-header h1 { margin: 0; font-size: 18px; }
    .chat-header p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .model-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .model-picker select {
      max-width: 210px;
      height: 36px;
      padding: 0 32px 0 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: white;
      font: inherit;
      cursor: pointer;
    }
    .model-picker select:focus { border-color: var(--blue); }
    .messages {
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .welcome { margin: auto; color: var(--muted); text-align: center; }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .bubble {
      max-width: min(78%, 680px);
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      line-height: 1.65;
      white-space: pre-wrap;
      background: white;
    }
    .user .bubble {
      color: white;
      background: var(--blue);
      border-color: var(--blue);
    }
    .composer {
      padding: 16px 24px 22px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
    }
    .composer input {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      font-size: 15px;
    }
    .composer input:focus { border-color: var(--blue); }
    .send-button {
      min-width: 72px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--blue);
      font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: wait; }
    [hidden] { display: none !important; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      opacity: 0;
      background: rgba(18, 27, 45, .38);
      backdrop-filter: blur(8px);
      transition: opacity .18s ease;
    }
    .modal-backdrop.visible { opacity: 1; }
    .modal-card {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 22px;
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 24px 70px rgba(20, 31, 54, .24);
      transform: translateY(10px) scale(.98);
      transition: transform .18s ease;
    }
    .modal-backdrop.visible .modal-card {
      transform: translateY(0) scale(1);
    }
    .modal-mark {
      width: 42px;
      height: 42px;
      margin-bottom: 17px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #c93649;
      background: #fff0f2;
      font-size: 22px;
      font-weight: 500;
    }
    .modal-card h2 { margin: 0; font-size: 19px; }
    .modal-card p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .delete-session-name {
      display: block;
      margin-top: 13px;
      padding: 11px 13px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: #f8faff;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-error {
      min-height: 20px;
      margin-top: 9px;
      color: #c93649;
      font-size: 12px;
    }
    .modal-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }
    .modal-button {
      min-width: 86px;
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 11px;
      font-weight: 600;
    }
    .modal-button.cancel {
      color: var(--ink);
      background: #eef2f8;
    }
    .modal-button.cancel:hover { background: #e4eaf4; }
    .modal-button.danger {
      color: white;
      background: #d63c50;
      box-shadow: 0 8px 18px rgba(214, 60, 80, .2);
    }
    .modal-button.danger:hover { background: #c93246; }
    @media (max-width: 720px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 180px minmax(0, 1fr);
      }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .session-list {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .session-item { min-width: 210px; }
      .session-actions { opacity: 1; }
      .bubble { max-width: 88%; }
      .chat-header { padding: 13px 16px; }
      .chat-header p { display: none; }
      .model-picker span { display: none; }
      .model-picker select { max-width: 150px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>对话记录</h2>
    </div>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <div>
        <h1 id="chatTitle">新对话</h1>
        <p>小原 AI 助手 · 对话已保存在本地</p>
      </div>
      <label class="model-picker">
        <span>模型</span>
        <select id="modelSelect" aria-label="选择对话模型"></select>
      </label>
    </header>
    <section class="messages" id="messages">
      <div class="welcome">你好，我是小原。现在可以直接和我对话。</div>
    </section>
    <form class="composer" id="composer">
      <input id="input" autocomplete="off" placeholder="给小原发消息">
      <button class="send-button" id="send" type="submit">发送</button>
    </form>
  </main>
</div>

<div class="modal-backdrop" id="deleteModal" hidden>
  <section
    class="modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="deleteModalTitle"
    aria-describedby="deleteModalDescription"
  >
    <div class="modal-mark" aria-hidden="true">×</div>
    <h2 id="deleteModalTitle">删除这个会话？</h2>
    <p id="deleteModalDescription">
      对话记录和对应摘要将从本地永久删除，此操作无法撤销。
    </p>
    <strong class="delete-session-name" id="deleteSessionName"></strong>
    <div class="modal-error" id="deleteModalError" aria-live="polite"></div>
    <div class="modal-actions">
      <button class="modal-button cancel" id="cancelDelete" type="button">取消</button>
      <button class="modal-button danger" id="confirmDelete" type="button">删除会话</button>
    </div>
  </section>
</div>

<script>
  const currentSessionKey = "xiaoyuan-current-session";
  const selectedModelKey = "xiaoyuan-selected-model";
  const sessionList = document.querySelector("#sessionList");
  const messages = document.querySelector("#messages");
  const chatTitle = document.querySelector("#chatTitle");
  const form = document.querySelector("#composer");
  const input = document.querySelector("#input");
  const sendButton = document.querySelector("#send");
  const modelSelect = document.querySelector("#modelSelect");
  const deleteModal = document.querySelector("#deleteModal");
  const deleteSessionName = document.querySelector("#deleteSessionName");
  const deleteModalError = document.querySelector("#deleteModalError");
  const cancelDeleteButton = document.querySelector("#cancelDelete");
  const confirmDeleteButton = document.querySelector("#confirmDelete");

  let sessions = [];
  let modelOptions = [];
  let currentSessionId = localStorage.getItem(currentSessionKey);
  let sending = false;
  let pendingDeleteSession = null;
  let modalReturnFocus = null;
  let modalDeleting = false;

  async function api(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "请求失败");
    return data;
  }

  function appendMessage(text, role) {
    messages.querySelector(".welcome")?.remove();
    const row = document.createElement("div");
    row.className = `row ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function renderSessions() {
    sessionList.replaceChildren();
    const newItem = document.createElement("div");
    newItem.className = "session-item new-session";
    if (!currentSessionId) newItem.classList.add("active");
    const newMain = document.createElement("div");
    newMain.className = "session-main";
    newMain.tabIndex = 0;
    newMain.setAttribute("role", "button");
    const newTitle = document.createElement("span");
    newTitle.className = "session-title";
    newTitle.textContent = "＋ 新对话";
    const newMeta = document.createElement("span");
    newMeta.className = "session-meta";
    newMeta.textContent = "发送第一条消息后保存";
    newMain.append(newTitle, newMeta);
    newMain.addEventListener("click", showNewConversation);
    newMain.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        showNewConversation();
      }
    });
    newItem.appendChild(newMain);
    sessionList.appendChild(newItem);

    for (const session of sessions) {
      const item = document.createElement("div");
      item.className = "session-item";
      if (session.sessionId === currentSessionId) item.classList.add("active");

      const main = document.createElement("div");
      main.className = "session-main";
      main.tabIndex = 0;
      main.setAttribute("role", "button");
      const title = document.createElement("span");
      title.className = "session-title";
      title.textContent = session.title;
      const meta = document.createElement("span");
      meta.className = "session-meta";
      meta.textContent = session.rounds ? `${session.rounds} 轮对话` : "尚未开始";
      main.append(title, meta);
      main.addEventListener("click", () => switchSession(session.sessionId));
      main.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          switchSession(session.sessionId);
        }
      });

      const actions = document.createElement("div");
      actions.className = "session-actions";
      const rename = document.createElement("button");
      rename.className = "icon-button";
      rename.type = "button";
      rename.title = "重命名";
      rename.textContent = "✎";
      rename.addEventListener("click", () => beginRename(session, title));
      const remove = document.createElement("button");
      remove.className = "icon-button delete";
      remove.type = "button";
      remove.title = "删除";
      remove.textContent = "×";
      remove.addEventListener("click", () => openDeleteModal(session, remove));
      actions.append(rename, remove);

      item.append(main, actions);
      sessionList.appendChild(item);
    }
  }

  async function refreshSessions() {
    sessions = await api("/api/sessions");
    renderSessions();
  }

  async function loadModels() {
    const catalog = await api("/api/models");
    modelOptions = catalog.filter(model => model.callable);
    if (!modelOptions.length) {
      throw new Error("没有已配置且可调用的模型");
    }

    const savedModel = localStorage.getItem(selectedModelKey);
    const selected = modelOptions.find(model => model.id === savedModel)
      || modelOptions.find(model => model.default)
      || modelOptions[0];
    modelSelect.replaceChildren();
    for (const model of modelOptions) {
      const option = document.createElement("option");
      option.value = model.id;
      const status = model.discovered
        ? (model.source === "cached" ? "缓存发现" : "已发现")
        : (model.source === "fallback" ? "兜底目录" : "已配置");
      option.textContent = `${model.provider} · ${model.label} · ${status}`;
      modelSelect.appendChild(option);
    }
    modelSelect.value = selected.id;
    localStorage.setItem(selectedModelKey, selected.id);
  }

  modelSelect.addEventListener("change", () => {
    localStorage.setItem(selectedModelKey, modelSelect.value);
  });

  function showNewConversation() {
    if (sending) return;
    currentSessionId = null;
    localStorage.removeItem(currentSessionKey);
    chatTitle.textContent = "新对话";
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.textContent = "发送第一条消息后，这个对话才会被保存。";
    messages.replaceChildren(welcome);
    renderSessions();
    input.focus();
  }

  async function switchSession(sessionId) {
    if (sending) return;
    currentSessionId = sessionId;
    localStorage.setItem(currentSessionKey, sessionId);
    renderSessions();
    const context = await api(`/api/sessions/${sessionId}`);
    chatTitle.textContent = context.title;
    messages.replaceChildren();
    if (!context.messages.length) {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.textContent = "新对话已准备好，给小原发一条消息吧。";
      messages.appendChild(welcome);
    } else {
      for (const message of context.messages) {
        appendMessage(message.content, message.role);
      }
    }
    messages.scrollTop = messages.scrollHeight;
  }

  function beginRename(session, titleElement) {
    if (sending) return;
    const editor = document.createElement("input");
    editor.className = "session-title-input";
    editor.value = session.title;
    editor.maxLength = 80;
    editor.setAttribute("aria-label", "修改会话名称");
    titleElement.replaceWith(editor);
    editor.focus();
    editor.setSelectionRange(editor.value.length, editor.value.length);

    let finished = false;
    async function finish(save) {
      if (finished) return;
      const nextTitle = editor.value.trim();
      if (save && !nextTitle) {
        editor.classList.add("error");
        editor.focus();
        return;
      }
      finished = true;
      if (!save || nextTitle === session.title) {
        renderSessions();
        return;
      }
      try {
        await api(`/api/sessions/${session.sessionId}`, {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({title: nextTitle}),
        });
        await refreshSessions();
        if (session.sessionId === currentSessionId) {
          chatTitle.textContent = nextTitle;
        }
      } catch (error) {
        finished = false;
        editor.classList.add("error");
        editor.focus();
      }
    }

    editor.addEventListener("click", event => event.stopPropagation());
    editor.addEventListener("keydown", event => {
      event.stopPropagation();
      if (event.key === "Enter") {
        event.preventDefault();
        finish(true);
      } else if (event.key === "Escape") {
        event.preventDefault();
        finish(false);
      }
    });
    editor.addEventListener("blur", () => finish(true));
  }

  function openDeleteModal(session, trigger) {
    if (sending) return;
    pendingDeleteSession = session;
    modalReturnFocus = trigger;
    deleteSessionName.textContent = session.title;
    deleteModalError.textContent = "";
    modalDeleting = false;
    cancelDeleteButton.disabled = false;
    confirmDeleteButton.disabled = false;
    confirmDeleteButton.textContent = "删除会话";
    deleteModal.hidden = false;
    requestAnimationFrame(() => deleteModal.classList.add("visible"));
    cancelDeleteButton.focus();
  }

  function closeDeleteModal() {
    if (deleteModal.hidden || modalDeleting) return;
    deleteModal.classList.remove("visible");
    const returnFocus = modalReturnFocus;
    pendingDeleteSession = null;
    modalReturnFocus = null;
    setTimeout(() => {
      deleteModal.hidden = true;
      returnFocus?.focus();
    }, 180);
  }

  async function confirmDeleteSession() {
    if (!pendingDeleteSession) return;
    const session = pendingDeleteSession;
    modalDeleting = true;
    confirmDeleteButton.disabled = true;
    cancelDeleteButton.disabled = true;
    confirmDeleteButton.textContent = "正在删除…";
    deleteModalError.textContent = "";
    const deletingCurrent = session.sessionId === currentSessionId;
    try {
      await api(`/api/sessions/${session.sessionId}`, {method: "DELETE"});
      if (deletingCurrent) currentSessionId = null;
      await refreshSessions();
      modalDeleting = false;
      closeDeleteModal();
      if (deletingCurrent) showNewConversation();
    } catch (error) {
      modalDeleting = false;
      deleteModalError.textContent = error.message;
      confirmDeleteButton.disabled = false;
      cancelDeleteButton.disabled = false;
      confirmDeleteButton.textContent = "删除会话";
    }
  }

  cancelDeleteButton.addEventListener("click", closeDeleteModal);
  confirmDeleteButton.addEventListener("click", confirmDeleteSession);
  deleteModal.addEventListener("click", event => {
    if (event.target === deleteModal) closeDeleteModal();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !deleteModal.hidden) {
      closeDeleteModal();
    }
    if (event.key === "Tab" && !deleteModal.hidden) {
      const first = cancelDeleteButton;
      const last = confirmDeleteButton;
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || sending) return;

    sending = true;
    sendButton.disabled = true;
    modelSelect.disabled = true;
    input.value = "";
    appendMessage(text, "user");
    const pending = appendMessage("正在思考…", "assistant");
    try {
      const payload = {message: text, model: modelSelect.value};
      if (currentSessionId) payload.sessionId = currentSessionId;
      const result = await api("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      currentSessionId = result.sessionId;
      localStorage.setItem(currentSessionKey, currentSessionId);
      pending.querySelector(".bubble").textContent = result.reply;
      chatTitle.textContent = result.title;
      await refreshSessions();
    } catch (error) {
      pending.querySelector(".bubble").textContent = `出错了：${error.message}`;
    } finally {
      sending = false;
      sendButton.disabled = false;
      modelSelect.disabled = false;
      input.focus();
    }
  });

  (async () => {
    try {
      await Promise.all([loadModels(), refreshSessions()]);
      const savedSessionExists = sessions.some(
        session => session.sessionId === currentSessionId
      );
      if (savedSessionExists) {
        await switchSession(currentSessionId);
      } else {
        showNewConversation();
      }
    } catch (error) {
      const failure = document.createElement("div");
      failure.className = "welcome";
      failure.textContent = `加载失败：${error.message}`;
      messages.replaceChildren(failure);
    }
  })();
</script>
</body>
</html>
