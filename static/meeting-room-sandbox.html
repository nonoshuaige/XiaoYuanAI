<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>会议室日程 · 小原 AI</title>
  <link rel="stylesheet" href="/static/meeting-room-sandbox.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回小原 AI 对话">
      <span class="brand-mark" aria-hidden="true">原</span>
      <span>
        <strong>会议室日程</strong>
        <small>小原 AI · 只读沙箱</small>
      </span>
    </a>
    <a class="back-link" href="/">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="m12.5 5-5 5 5 5" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>返回对话</span>
    </a>
  </header>

  <main class="workspace">
    <section class="date-board" aria-labelledby="pageTitle">
      <div class="title-block">
        <span class="eyebrow">MEETING ROOM SCHEDULE</span>
        <h1 id="pageTitle">选择一天，查看所有会议室</h1>
        <p>按楼层浏览房间，点击任意房间查看 09:00–18:00 的半小时日程。</p>
      </div>

      <div class="date-picker" aria-label="选择日程日期">
        <button class="icon-button" id="previousDay" type="button"
          aria-label="前一天">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="m12.5 5-5 5 5 5" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round"
              stroke-linejoin="round"/>
          </svg>
        </button>
        <label class="date-field">
          <span>日期</span>
          <input id="scheduleDate" type="date">
        </label>
        <button class="today-button" id="todayButton" type="button">今天</button>
        <button class="icon-button" id="nextDay" type="button"
          aria-label="后一天">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="m7.5 5 5 5-5 5" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round"
              stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="day-summary" aria-live="polite">
      <div>
        <span id="displayDate">正在读取日期</span>
        <strong id="displayWeekday">—</strong>
      </div>
      <div>
        <span>楼层</span>
        <strong id="floorCount">—</strong>
      </div>
      <div>
        <span>会议室</span>
        <strong id="roomCount">—</strong>
      </div>
      <div>
        <span>日程范围</span>
        <strong>09:00–18:00</strong>
      </div>
      <button class="refresh-button" id="refreshButton" type="button">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M15.8 7.1A6.5 6.5 0 1 0 16.2 12M15.8 3.8v3.6h-3.6"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round"/>
        </svg>
        刷新
      </button>
    </section>

    <section class="schedule-board" aria-label="各楼层会议室">
      <div class="state-panel loading-state" id="loadingState">
        <div class="skeleton-heading"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-heading short"></div>
        <div class="skeleton-row"></div>
      </div>

      <div class="state-panel empty-state" id="emptyState" hidden>
        <span class="state-mark" aria-hidden="true">0</span>
        <h2>这一天没有会议室数据</h2>
        <p>请选择其他日期，或确认沙箱数据已经初始化。</p>
      </div>

      <div class="state-panel error-state" id="errorState" hidden>
        <span class="state-mark" aria-hidden="true">!</span>
        <h2>会议室日程读取失败</h2>
        <p id="errorCopy">请确认会议室沙箱正在运行。</p>
        <button type="button" id="retryButton">重新读取</button>
      </div>

      <div class="floor-list" id="floorList" hidden></div>
    </section>
  </main>

  <dialog class="room-dialog" id="roomDialog">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div>
          <span class="dialog-floor" id="dialogFloor">—</span>
          <h2 id="dialogRoomName">会议室日程</h2>
          <p id="dialogRoomMeta">—</p>
        </div>
        <button class="dialog-close" id="closeDialog" type="button"
          aria-label="关闭房间日程">×</button>
      </header>

      <div class="dialog-date">
        <div>
          <span>日期</span>
          <strong id="dialogDate">—</strong>
        </div>
        <div class="legend" aria-label="日程状态图例">
          <span><i class="legend-dot available"></i>可用</span>
          <span><i class="legend-dot occupied"></i>已预约</span>
        </div>
      </div>

      <div class="timeline-heading">
        <span>时间</span>
        <span>状态与会议</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </dialog>

  <script type="module" src="/static/meeting-room-sandbox.js"></script>
</body>
</html>
